<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Semáforo Inteligente</title>

<style>
body {
  text-align: center;
  font-family: Arial;
  background: #222;
  color: white;
}

/* Contenedor */
.semaforo {
  width: 100px;
  background: #333;
  padding: 15px;
  border-radius: 20px;
  margin: 50px auto;
}

/* Luces */
.luz {
  width: 60px;
  height: 60px;
  margin: 10px auto;
  border-radius: 50%;
  background: #111;
  opacity: 0.3;
  transition: 0.3s;
}

.rojo.activo {
  background: red;
  opacity: 1;
  box-shadow: 0 0 20px red;
}

.amarillo.activo {
  background: yellow;
  opacity: 1;
  box-shadow: 0 0 20px yellow;
}

.verde.activo {
  background: lime;
  opacity: 1;
  box-shadow: 0 0 20px lime;
}

#estado {
  font-size: 22px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>🚦 Semáforo con Sensor Ultrasónico</h1>
<div id="distancia">Cargando...</div>

<div class="semaforo">
  <div class="luz rojo" id="rojo"></div>
  <div class="luz amarillo" id="amarillo"></div>
  <div class="luz verde" id="verde"></div>
</div>

<div id="estado"></div>

<script>

const token = "19d888a9-f465-4556-8f8c-f094161bb43d"; // 👈 cambia por el tuyo

function actualizar() {

  fetch("https://api.tago.io/data?variable=distancia", {
    headers: { "Device-Token": token }
  })
  .then(res => res.json())
  .then(data => {

    let d = data.result[0].value;

    document.getElementById("distancia").innerHTML =
      "Distancia: " + d + " cm";

    let rojo = document.getElementById("rojo");
    let amarillo = document.getElementById("amarillo");
    let verde = document.getElementById("verde");
    let estado = document.getElementById("estado");

    // Reset luces
    rojo.classList.remove("activo");
    amarillo.classList.remove("activo");
    verde.classList.remove("activo");

    // 🚨 Lógica del semáforo según distancia
    if (d < 15) {
      rojo.classList.add("activo");
      estado.innerHTML = "🔴 ALTO (muy cerca)";
    } 
    else if (d < 30) {
      amarillo.classList.add("activo");
      estado.innerHTML = "🟡 PRECAUCIÓN";
    } 
    else {
      verde.classList.add("activo");
      estado.innerHTML = "🟢 AVANZA";
    }

  })
  .catch(err => console.log(err));
}

// Actualiza cada 700 ms
setInterval(actualizar, 700);

</script>

</body>
</html>
